/*
 * app 模块的构建脚本 —— 这里才是真正决定“怎么编译、依赖哪些库”的地方
 */
plugins {
    id 'com.android.application'   // 这是一个 Android 应用程序模块
}

android {
    // 新版 AGP 用 namespace 代替了 AndroidManifest.xml 中的 package 属性
    namespace 'com.wordstudy'
    compileSdk 34                  // 编译时使用的 SDK 版本
    // 指定已安装的 Build-Tools 版本，避免 Android Studio / Gradle 再去联网下载 34.0.0
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.wordstudy"   // 应用包名（在手机上安装的唯一标识）
        minSdk 24                        // 最低支持 Android 7.0（API 24）
        targetSdk 34                     // 目标 SDK 版本
        versionCode 1                     // 版本号（内部使用，整数）
        versionName "1.0"                 // 版本号（展示给用户看）
    }

    buildTypes {
        release {
            minifyEnabled false       // 课设项目不做代码混淆，方便调试
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Java 编译版本：17（Android Studio 自带的 JDK 是 17，可以直接用）
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AppCompat：让 Activity 兼容各个 Android 版本，提供 Material 主题基础
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Material 组件库：提供 MaterialCardView、MaterialButton、BottomNavigationView
    implementation 'com.google.android.material:material:1.10.0'
    // 约束布局：编写 xml 布局时常用
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // RecyclerView：生词本列表
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ---------- Room 数据库 ----------
    implementation 'androidx.room:room-runtime:2.6.1'          // Room 运行时
    annotationProcessor 'androidx.room:room-compiler:2.6.1'     // Room 注解处理器（编译期自动生成 Dao 实现类）
}
